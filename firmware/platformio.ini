; PlatformIO project for GPS Catering Tracker firmware.
;
; Two build environments live in this file:
;
;   [env:esp32doit-devkit-v1] -- BUILD_MODE=1 (Wokwi simulator).
;       Preserves Packet 17.3 behavior verbatim: mock GPS waypoints,
;       Wi-Fi, HTTPS POST via WiFiClientSecure::setInsecure(), NTP.
;       This env is the default (see `default_envs` below). The env
;       name deliberately matches the board id so that
;       `.pio/build/esp32doit-devkit-v1/firmware.bin` is where the
;       Wokwi VS Code extension expects to find the artifact
;       (`wokwi.toml` is unchanged).
;
;   [env:hardware] -- BUILD_MODE=2 (real ESP32 on the motorcycle).
;       NEO-6M GPS on UART2, SIM800L GSM/GPRS on UART1, plain HTTP
;       POST on port 80 (SIM800L cannot do modern TLS reliably; the
;       VPS Caddy config exposes a telemetry-only port-80 listener,
;       see Packet 18). GPS timestamp comes from the satellite fix
;       instead of NTP.
;
; Build the wokwi env:      pio run
; Build the hardware env:   pio run -e hardware
; Upload hardware firmware: pio run -e hardware -t upload

[platformio]
default_envs = esp32doit-devkit-v1

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:esp32doit-devkit-v1]
build_flags =
    -DBUILD_MODE=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

[env:hardware]
build_flags =
    -DBUILD_MODE=2
    -DTINY_GSM_MODEM_SIM800
    -DTINY_GSM_RX_BUFFER=1024
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    mikalhart/TinyGPSPlus @ ^1.0.3
    vshymanskyy/TinyGSM @ ^0.11.7
